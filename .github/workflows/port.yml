name: Port build 26.1.2
on:
  push:
  workflow_dispatch:
jobs:
  ccl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Clone CodeChickenLib
        run: git clone --depth 1 https://github.com/TheCBProject/CodeChickenLib.git ccl
      - name: Patch CCL to 26.1.2
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path("ccl/gradle.properties")
          s=p.read_text().replace("mc_version=1.21.11","mc_version=26.1.2").replace("forge_version=21.11.42","forge_version=26.1.2.106")
          p.write_text(s)
          p=Path("ccl/build.gradle")
          s=p.read_text().replace("JavaLanguageVersion.of(21)","JavaLanguageVersion.of(25)")
          s=re.sub(r'\n\s*compileOnly\("mezz\.jei:jei-\$\{mc_version\}-neoforge:\$\{jei_version\}"\) \{\s*transitive false\s*\}\s*', '\n', s)
          p.write_text(s)
      - name: Build CCL
        working-directory: ccl
        run: |
          chmod +x gradlew
          ./gradlew clean build -x test -x javadoc --stacktrace
      - name: Upload CCL
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: CodeChickenLib-26.1.2-port
          path: ccl/build/libs/*.jar
