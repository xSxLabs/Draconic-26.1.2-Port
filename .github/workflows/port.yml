name: Port build 26.1.2
# trigger: pr-build-2026-10-01-b
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  ccl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Clone CodeChickenLib
        run: git clone --depth 1 https://github.com/TheCBProject/CodeChickenLib.git ccl
      - name: Clone CCL legacy API source
        run: git clone --depth 1 --branch 1.21.1 https://github.com/TheCBProject/CodeChickenLib.git ccl-legacy
      - name: Patch CCL to 26.1.2
        run: python scripts/port_ccl.py
      - name: Build CCL
        working-directory: ccl
        run: |
          chmod +x gradlew
          for i in 1 2 3 4; do ./gradlew clean build -x test -x javadoc --stacktrace && break; sleep 20; done
          test -n "$(find build/libs -name '*.jar' -not -name '*sources*' -not -name '*javadoc*' -print -quit)"
      - name: Clone BrandonsCore
        run: git clone --depth 1 --branch 1.21 https://github.com/Draconic-Inc/BrandonsCore.git bc
      - name: Patch BrandonsCore to 26.1.2
        run: python scripts/port_bc.py
      - name: Compile BrandonsCore
        working-directory: bc
        run: |
          chmod +x gradlew
          ./gradlew wrapper --gradle-version 9.1.0 || true
          ./gradlew compileJava --stacktrace
      - name: Upload CCL
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CodeChickenLib-26.1.2-port
          path: ccl/build/libs/*.jar
